[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["firmware"]

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
version = "0.1.0"
publish = false
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
postcard-rpc = { version = "0.12", default-features = false }
postcard-schema = { version = "0.2", default-features = false, features = ["derive", "heapless-v0_8"] }
heapless = { version = "0.8", default-features = false, features = ["serde"] }
libm = "0.2"
embedded-storage = "0.3"
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = 2

[profile.android]
inherits = "release"
panic = "unwind"
debug = 0
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2
